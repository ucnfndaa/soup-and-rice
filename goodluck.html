<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Good Luck! 🍀</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #dff8d8,
                    #d8efff,
                    #eee0ff
                );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            text-align: center;

            background: rgba(255, 255, 255, 0.92);

            padding: 40px;

            border-radius: 30px;

            max-width: 600px;
            margin: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.15);

            animation: appear 1s ease;

            z-index: 5;
        }

        .emoji {
            font-size: 85px;

            animation: bounce 1.5s infinite;
        }

        h1 {
            font-size: 45px;
            margin: 15px 0;
        }

        .main-message {
            font-size: 25px;
            font-weight: bold;
        }

        p {
            font-size: 19px;
            line-height: 1.7;
        }

        .little-note {
            margin-top: 25px;

            padding: 18px;

            border-radius: 20px;

            background: #f0f9eb;
        }

        .star {
            position: absolute;

            top: -30px;

            font-size: 25px;

            animation:
                fall linear infinite;

            z-index: 1;
        }

        @keyframes appear {

            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

        }

        @keyframes fall {

            from {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <div class="card">

        <div class="emoji">
            🍀
        </div>

        <h1>
            Good Luck! 📚✨
        </h1>

        <p class="main-message">
            You got this! 💚
        </p>

        <p>
            Kaya mo 'yan sa exam!
            Take a deep breath, stay calm,
            and trust everything you've learned. 📝
        </p>

        <div class="little-note">

            <p>
                Don't pressure yourself too much. 💗
            </p>

            <p>
                One question at a time.
                Just do your best.
                That's already something to be proud of. ✨
            </p>

            <p>
                <strong>
                    I believe in you! 🍀💚
                </strong>
                GOOO BFF !! :))
            </p>

        </div>

    </div>


    <script>

        const emojis = [
            "🍀",
            "✨",
            "⭐",
            "💚",
            "📚"
        ];

        function createStars() {

            for (let i = 0; i < 35; i++) {

                const star =
                    document.createElement("div");

                star.className = "star";

                star.innerHTML =
                    emojis[
                        Math.floor(
                            Math.random()
                            * emojis.length
                        )
                    ];

                star.style.left =
                    Math.random() * 100 + "vw";

                star.style.animationDuration =
                    (4 + Math.random() * 5) + "s";

                star.style.animationDelay =
                    Math.random() * 5 + "s";

                document.body.appendChild(star);
            }
        }

        createStars();

    </script>


</body>

</html>
