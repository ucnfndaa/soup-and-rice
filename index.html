<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise 🎂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #d9c7ff
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            text-align: center;
            padding: 30px;
            z-index: 5;
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 21px;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            padding: 15px 32px;

            border: none;
            border-radius: 30px;

            background: #ff75aa;
            color: white;

            font-size: 20px;
            cursor: pointer;

            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        button:hover {
            transform: scale(1.08);
        }

        .birthday {
            display: none;
        }

        .cake {
            font-size: 100px;

            animation: bounce 1.5s infinite;
        }

        .balloon {
            position: absolute;
            bottom: -100px;

            font-size: 60px;

            animation: float 7s linear infinite;

            z-index: 1;
        }

        .confetti {
            position: fixed;

            top: -30px;

            font-size: 25px;

            z-index: 9999;

            animation: fall 3s linear forwards;
        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

        }

        @keyframes float {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-120vh);
            }

        }

        @keyframes fall {

            from {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }

        }
    </style>
</head>


<body>

    <div class="screen" id="opening">

        <h1>🎁 A Little Surprise...</h1>

        <p>
            Someone prepared something special for you 💗
        </p>

        <button onclick="openSurprise()">
            Open Me 💌
        </button>

    </div>


    <div class="screen birthday" id="birthday">

        <div class="cake">
            🎂
        </div>

        <h1>
            🎉 Happy Birthday! 🎉
        </h1>

        <p>
            May your day be filled with happiness,<br>
            laughter, and beautiful memories. 💖
        </p>

        <p>
            You deserve all the good things in the world! ✨
        </p>

    </div>


    <script>

        function openSurprise() {

            document.getElementById("opening").style.display = "none";

            document.getElementById("birthday").style.display = "block";

            createBalloons();

            createConfetti();

        }


        function createBalloons() {

            for (let i = 0; i < 20; i++) {

                const balloon =
                    document.createElement("div");

                balloon.className = "balloon";

                balloon.innerHTML = "🎈";

                balloon.style.left =
                    Math.random() * 100 + "vw";

                balloon.style.animationDuration =
                    (5 + Math.random() * 5) + "s";

                document.body.appendChild(balloon);

            }

        }


        function createConfetti() {

            const emojis = [
                "🎉",
                "✨",
                "💖",
                "🎊",
                "⭐",
                "💗"
            ];

            for (let i = 0; i < 100; i++) {

                const confetti =
                    document.createElement("div");

                confetti.className = "confetti";

                confetti.innerHTML =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];

                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                document.body.appendChild(confetti);

                setTimeout(() => {

                    confetti.remove();

                }, 5000);

            }

        }

    </script>

</body>

</html>
