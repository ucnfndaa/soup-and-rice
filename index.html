<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>A Little Something 💌</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #d9c7ff
                );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background:
                rgba(255, 255, 255, 0.9);

            padding: 45px;

            border-radius: 30px;

            text-align: center;

            max-width: 600px;

            margin: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.15);

            animation: pop 1s ease;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 15px;

            justify-content: center;

            flex-wrap: wrap;

            margin-top: 25px;
        }

        button {
            padding: 15px 25px;

            border: none;

            border-radius: 30px;

            font-size: 18px;

            cursor: pointer;

            color: white;

            transition: 0.2s;
        }

        .birthday {
            background: #ff75aa;
        }

        .goodluck {
            background: #70b85a;
        }

        button:hover {
            transform: scale(1.08);
        }

        .emoji {
            font-size: 75px;
        }

        @keyframes pop {

            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

    </style>

</head>


<body>


    <div class="card">

        <div class="emoji">
            💌
        </div>

        <h1>
            A Little Something ✨
        </h1>

        <p>
            I made a couple of little surprises.
            Pick one! 💗
        </p>


        <div class="buttons">

            <button
                class="birthday"
                onclick="location.href='birthday.html'">

                🎂 Birthday Surprise

            </button>


            <button
                class="goodluck"
                onclick="location.href='goodluck.html'">

                🍀 Good Luck!

            </button>

        </div>

    </div>


</body>

</html>
